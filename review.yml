  - date: '2026-09-01'
    rating: 4
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before saving anything. The June 2026 profile recorded two surfaces; seven
      institution-operated machine surfaces were found and verified live on 2026-09-01, plus two
      vendor tenancies and three registry memberships that the earlier profile missed entirely.
      New and institution-operated: three further AlmaDL OAI-PMH 2.0 providers (AMS Tesi di
      Dottorato, AMS Tesi di Laurea, AlmaDL Journals with 100 journal sets), a Shibboleth SAML 2.0
      identity provider at shib.unibo.it published in the IDEM GARR AAI federation aggregate, and
      an LTI 1.3 platform surface (JWKS plus OAuth2 token endpoint) on the self-hosted Moodle at
      virtuale.unibo.it. New and correctly labelled as TENANT rather than credited to the
      university: cris.unibo.it (IRIS) CNAMEs to unibo.prod.iris.cineca.it, and almastart.unibo.it
      CNAMEs to unibo.primo.exlibrisgroup.com (Ex Libris Primo VE, tenant 39UBO_INST). New registry
      memberships evidenced from public endpoints: DataCite provider UYEY (five prefixes, 32,291
      DOIs), Crossref member 32492 (prefix 10.60923, 1,170 DOIs) and ROR 01111rn36. Six
      education-regime domain standards are evidenced from live endpoints — oai-pmh, shibboleth,
      saml, lti, datacite, crossref. Still absent and stated as such: no OpenAPI, no developer
      portal, no self-service keys, no status page, no llms.txt, no security.txt, no ORCID in any
      served metadata. Three REST APIs on institution hosts are all closed to anonymous callers
      (OJS 403, Moodle Web Services invalidtoken, IRIS 401). No vendor contract was saved and no
      endpoint was fabricated.
