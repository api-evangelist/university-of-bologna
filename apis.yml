x-coverage:
  state: covered
  reason: covered
  detail: >-
    Seven institution-operated machine surfaces were found and verified live on
    2026-09-01 — a CKAN 2.6.9 Action API at dati.unibo.it, four separate AlmaDL
    OAI-PMH 2.0 providers (AMS Acta, AMS Tesi di Dottorato, AMS Tesi di Laurea,
    AlmaDL Journals), a Shibboleth SAML 2.0 identity provider published in the
    IDEM GARR AAI aggregate, and an LTI 1.3 platform surface on the self-hosted
    Moodle at virtuale.unibo.it — plus six education-regime domain standards
    evidenced from live endpoints (oai-pmh, shibboleth, saml, lti, datacite,
    crossref). The university publishes no OpenAPI, no developer portal, no
    self-service key issuance, no status page and no rate-limit or API terms
    documentation for any of them, and no contract has been generated to stand in
    for one: CKAN, EPrints, OJS, Moodle and DSpace-CRIS contracts are product
    contracts shared by every deployment of that software and belong in the
    vendors' own repos. Three REST surfaces exist on institution or
    institution-branded hosts and all three are closed — the OJS API v1 returns
    403 api.403.unauthorized, Moodle Web Services returns invalidtoken, and the
    IRIS DSpace REST API returns 401 basic-auth — recorded in authentication/
    rather than counted as callable. Two tenancies were recorded rather than
    deleted or credited: cris.unibo.it CNAMEs to unibo.prod.iris.cineca.it
    (CINECA IRIS) and almastart.unibo.it CNAMEs to unibo.primo.exlibrisgroup.com
