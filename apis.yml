    x-operator: institution
    description: >-
      Virtuale is the university's self-hosted Moodle learning management system,
      on its own host virtuale.unibo.it (frontend-http-azure-01.unibo.it), and it
      exposes a live LTI 1.3 platform surface. Verified live 2026-09-01 —
      https://virtuale.unibo.it/mod/lti/certs.php returns 200 application/json
      with a JWKS containing an RS256 RSA key (kid a0f8811debf999e8089e), and the
      paired OAuth2 token endpoint https://virtuale.unibo.it/mod/lti/token.php
      returns 400 {"error":"invalid_request"} to an empty request, which is a
      live, correctly-rejecting endpoint rather than a soft 404. The Moodle Web
      Services REST API is present on the same host and token-gated:
      /webservice/rest/server.php returns 200 application/xml with
      <ERRORCODE>invalidtoken</ERRORCODE> and the Italian message "Token non
      valido - il token non è stato trovato". Moodle is open-source software and
      its API contract is Moodle's, so none is saved here; the deployment, the
      host, the LTI platform keys and the courses are the university's. Tokens are
      not self-service — they are issued to integrations by the university, so
      this is not a callable public API.
    humanURL: https://virtuale.unibo.it/
    baseURL: https://virtuale.unibo.it/mod/lti/certs.php
    tags: [ Learning Management, LTI, Moodle, JWKS, OAuth2, Education ]
