apis:
  - aid: university-of-bologna:opendata-ckan
    name: University of Bologna Open Data (CKAN Action API)
    x-operator: institution
    description: >-
      Institution-operated CKAN open data portal serving the standard CKAN Action
      API over University of Bologna datasets. Verified live 2026-09-01 —
      https://dati.unibo.it/api/3/action/package_list returned 200 application/json
      with success:true and a dataset list opening bilancio2016, bilancio2017,
      campus-figures, course-catalogue-2016 … course-catalogue-2021, and
      https://dati.unibo.it/api/3/action/status_show returned 200 with
      ckan_version "2.6.9", site_url https://dati.unibo.it, site_title "Opendata
      beta, University of Bologna", locale_default "it". The host is the
      university's own — dati.unibo.it resolves through atrproxy5.unibo.it to
      137.204.24.200, inside UNIBO's own allocation — so the deployment, the
      datasets and the endpoint are the institution's. CKAN itself is open-source
      software from the Open Knowledge Foundation and its Action API contract is
      the product's, shared by every CKAN portal, so no OpenAPI is saved under
      this institution. Honest caveat on liveness: after the two successful probes
      above, this host stopped answering our client entirely — TCP 443 still
      accepts a connection but no HTTP response is returned within 60s. That is a
      rate-limit or WAF reaction to our own probing, not evidence the service is
      down, and it is recorded here rather than silently omitted.
    humanURL: https://dati.unibo.it/
