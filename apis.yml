description: >-
  The University of Bologna (Alma Mater Studiorum - Università di Bologna) is the
  oldest university in the Western world, founded in 1088, and Italy's largest
  public research university, ranked #133 in the QS World University Rankings
  2025. It publishes no OpenAPI, runs no developer portal and issues no API keys,
  and this profile does not pretend otherwise. What it does operate, on its own
  unibo.it hosts and its own network (137.204.24.0/24), is an unusually deep set
  of standards-based machine surfaces for a university: a CKAN 2.6.9 open data
  portal serving the CKAN Action API at dati.unibo.it; four separate live
  OAI-PMH 2.0 providers run by the AlmaDL digital library — AMS Acta
  (institutional research repository, EPrints, ten metadata formats including
  oai_datacite and openaire_oai_dc), AMS Tesi di Dottorato (doctoral theses),
  AMS Tesi di Laurea (graduate theses) and AlmaDL Journals (Open Journal
  Systems, 100 open-access journals); a Shibboleth SAML 2.0 identity provider,
  entityID https://shib.unibo.it/idp/shibboleth, published as machine-readable
  metadata both on its own host and in the IDEM GARR AAI federation aggregate;
  and a self-hosted Moodle at virtuale.unibo.it exposing a live LTI 1.3 platform
  surface (JWKS plus an OAuth2 token endpoint) alongside a token-gated Moodle
  Web Services REST API. Its DataCite registration (provider UYEY, five
  prefixes, 32,291 DOIs), its Crossref membership (member 32492, prefix
  10.60923, 1,170 DOIs) and its ROR identifier 01111rn36 are verifiable from
  public registry endpoints. Two further surfaces are the university's data on
  someone else's platform and are recorded as tenancies, not as its contracts:
  the IRIS research information system at cris.unibo.it CNAMEs to
  unibo.prod.iris.cineca.it (CINECA), and the AlmaStart library discovery layer
  at almastart.unibo.it CNAMEs to unibo.primo.exlibrisgroup.com (Ex Libris Primo
  VE). The university's generative-AI policy is a real governance artifact but
  exists only on the Italian surface. Administrative, student-record and
  course-catalogue systems are behind institutional SSO and are not openly
  documented.
